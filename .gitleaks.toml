title = "Enterprise Site Template Secret Scanner Rules (ISO 27001)"

[extend]
useDefault = true

[[rules]]
id = "osticket-api-key"
description = "osTicket Helpdesk API Key"
regex = '''(?i)(osticket_api_key|x-api-key)\s*[:=]\s*['"][A-F0-9]{32}['"]'''
tags = ["key", "osticket"]

[[rules]]
id = "hardcoded-admin-password"
description = "Hardcoded Admin Password"
regex = '''(?i)(admin_secret|admin_pass)\s*[:=]\s*['"][^'"$]{8,}['"]'''
tags = ["password", "admin"]

[allowlist]
description = "Allowlist for template examples, tests and legacy rotated commits"
paths = [
  '''^\.env\.example$''',
  '''^tests/.*''',
]
commits = [
  "67f812bfb621232c5ace84dc9e6bfb435aed8300",
  "9c6428971646315e1d477f136bb6fa997266223f",
]
